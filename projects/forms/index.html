<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="forms.css">

</head>
<body>
    <header>
        <h1>Student Registration</h1>
    </header>

    <main>
        <h2>Register as a Student</h2>

        <form action="formprocessing.html" method="get" id="signup-form">
            <div class="form-row">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Last Name, First Name" required>
            </div>

            <div class="form-row">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="email@xxx.com" required>
            </div>

            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-row">
            <label for="birthdate">Date of Birth:</label>
            <input type="date" id="birthdate" name="birthdate" required>
            </div>

            <div class="form-row">
            <label for="about">About Me:</label>
            <textarea id="about" name="about" placeholder="Something about you!"></textarea>
            </div>

            <fieldset>
                <legend>Gender</legend>

                <div class="form-row">
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>
                </div>

                <div class="form-row">
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
                </div>
            </fieldset>

                <div class="form-row">
                <label for="course">Choose Your Course:</label>

            <select id="course" name="course" required>
                <option value="">Select a Course</option>
                <option value="IT">Information Technology</option>
                <option value="Business">Business</option>
                <option value="Education">Education</option>
            </select>
            </div>

                <div class="form-row checkbox-row">
                <input type="checkbox" id="remember" name="remember" value="yes">
                <label for="remember">Remember Me</label>
                </div>
            
            <button type="submit">Sign Up</button>
            <p id="message"></p>
        </form>

    </main>
    <footer>
        <p>&copy; 2026 Prince Astrero</p>
    </footer>

<script src="forms.js"></script>
</body>
</html>
